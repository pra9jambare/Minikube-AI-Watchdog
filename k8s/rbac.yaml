apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-watchdog
  namespace: ai-watchdog
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-watchdog-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-watchdog-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ai-watchdog
    namespace: ai-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-watchdog-reader
